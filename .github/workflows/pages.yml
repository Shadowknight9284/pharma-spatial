# Deploy web/ to GitHub Pages. Manual on purpose: enable Pages first
# (Settings -> Pages -> Source: GitHub Actions), then Actions -> "pages" -> Run workflow.
# Add `push: {branches: [main], paths: ["web/**"]}` under `on:` to deploy on every push.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # deploy-pages sometimes can't see an artifact uploaded a second earlier ("No artifacts named
      # github-pages were found"); give the artifact API a moment to catch up.
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
